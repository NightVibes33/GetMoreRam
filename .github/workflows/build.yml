name: iOS 27 - Xcode 27 - Unsigned IPA and Android Apple Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-android-connectivity:
    name: Pixel 7 Android -> Apple lookup (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android request generation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Pixel 7 connection to Apple's provisioning lookup
        run: python3 scripts/apple_android_probe.py

  unsigned-ipa:
    name: Build unsigned GetMoreRam.ipa using Xcode 27
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Confirm Xcode 27 and iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          [[ "$sdk" == 27* ]]
      - name: Resolve Swift dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -project GetMoreRam.xcodeproj -scheme GetMoreRam
      - name: Align StosSign identity and add Apple auth error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_stossign_auth.py "$RUNNER_TEMP/SourcePackages/checkouts/StosSign/Sources/StosSign_Auth/Authentication.swift"
      - name: Archive without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GetMoreRam.xcodeproj \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -scheme GetMoreRam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GetMoreRam.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Verify bundle ID, minimum OS and unsigned binary
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app"
          test -d "$app"
          test -f "$app/GetMoreRam"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          minimum=$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/Info.plist")
          echo "Bundle ID: $bundle"
          echo "Minimum iOS: $minimum"
          [[ "$bundle" == "com.nightvibes33.getmoreram" ]]
          [[ "$minimum" == "27.0" ]]
          if codesign --verify "$app" >/dev/null 2>&1; then
            echo "ERROR: Expected unsigned app but codesign verified it" >&2
            exit 1
          fi
          echo "Unsigned application verified."
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app" "$RUNNER_TEMP/unsigned/Payload/"
          cd "$RUNNER_TEMP/unsigned"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/GetMoreRam-unsigned-iOS27.ipa" Payload
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/GetMoreRam-unsigned-iOS27.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-unsigned-iOS27
          path: GetMoreRam-unsigned-iOS27.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-Xcode27-build-logs
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
