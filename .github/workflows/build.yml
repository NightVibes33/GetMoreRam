name: iOS 18-27 - Xcode 27 - Unsigned IPA and Android Apple Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-android-connectivity:
    name: Pixel 7 Android -> Apple lookup (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android request generation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Pixel 7 connection to Apple's provisioning lookup
        # This unauthenticated connectivity probe is informational. The runner
        # may have TLS interception; do not block IPA generation on that.
        continue-on-error: true
        run: python3 scripts/apple_android_probe.py

  unsigned-ipa:
    name: Build unsigned GetMoreRam iOS 18-27 IPA using Xcode 27
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Confirm Xcode 27 and iOS 27 SDK for iOS 18+ compatibility
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          [[ "$sdk" == 27* ]]
      - name: Verify all ten supplied Xcode icon assets and previews
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          root = Path("GetMoreRam/Assets.xcassets")
          names = ("Default","Blue","Purple","Green","Mono","Glass","Orbit","Gradient","Carbon","Board")
          for name in names:
              base = root / ("AppIcon.appiconset" if name == "Default" else name + ".appiconset")
              png = base / (name + ".png")
              info = json.loads((base / "Contents.json").read_text())
              assert info["images"][0]["filename"] == name + ".png"
              raw = png.read_bytes()
              assert raw[:8] == b"\\x89PNG\\r\\n\\x1a\\n"
              assert struct.unpack(">II",raw[16:24]) == (1024,1024), name
              preview = root / ("IconPreview-" + name + ".imageset") / (name + ".png")
              preview_bytes = preview.read_bytes()
              assert struct.unpack(">II",preview_bytes[16:24]) == (256,256), name
          print("Validated ten supplied 1024px icon artworks and matching Settings previews.")
          PY
      - name: Resolve Swift dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -project GetMoreRam.xcodeproj -scheme GetMoreRam
      - name: Align StosSign identity and add Apple auth error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_stossign_auth.py "$RUNNER_TEMP/SourcePackages/checkouts/StosSign/Sources/StosSign_Auth/Authentication.swift"
          grep -n 'AuthKit/1 (Macintosh; OS X 26.6)' "$RUNNER_TEMP/SourcePackages/checkouts/StosSign/Sources/StosSign_Auth/Authentication.swift"
      - name: Allow Apple's developer API to return JSON or plist
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_stossign_api_response.py "$RUNNER_TEMP/SourcePackages/checkouts/StosSign/Sources/StosSign_API/AppleAPI.swift"
      - name: Archive without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GetMoreRam.xcodeproj \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -scheme GetMoreRam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GetMoreRam.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Verify bundle ID, minimum OS and unsigned binary
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app"
          test -d "$app"
          test -f "$app/GetMoreRam"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          minimum=$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/Info.plist")
          echo "Bundle ID: $bundle"
          echo "Minimum iOS: $minimum"
          [[ "$bundle" == "com.nightvibes33.getmoreram" ]]
          [[ "$minimum" == "18.0" ]]
          if codesign --verify "$app" >/dev/null 2>&1; then
            echo "ERROR: Expected unsigned app but codesign verified it" >&2
            exit 1
          fi
          echo "Unsigned application verified."
          /usr/libexec/PlistBuddy -c "Print CFBundleIcons:CFBundleAlternateIcons" "$app/Info.plist"
          for icon in Blue Purple Green Mono Glass Orbit Gradient Carbon Board; do
            /usr/libexec/PlistBuddy -c "Print CFBundleIcons:CFBundleAlternateIcons:$icon" "$app/Info.plist" >/dev/null
            echo "Registered alternate icon: $icon"
          done
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app" "$RUNNER_TEMP/unsigned/Payload/"
          cd "$RUNNER_TEMP/unsigned"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/GetMoreRam-unsigned-iOS18-27.ipa" Payload
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/GetMoreRam-unsigned-iOS18-27.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-unsigned-iOS18-27
          path: GetMoreRam-unsigned-iOS18-27.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-Xcode27-build-logs
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
